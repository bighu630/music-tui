name: build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - name: darwin-amd64
            os: macos-15-intel # Intel x64 macOS（macos-13 已退役，官方迁移标签）
            goos: darwin
            goarch: amd64
            ext: ''
          - name: darwin-arm64
            os: macos-15 # Apple Silicon macOS
            goos: darwin
            goarch: arm64
            ext: ''
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        # 各平台在各自 runner 上原生运行测试（linux 跑 linux 测试、mac 跑 mac 测试）
        run: go test ./...

      - name: Build ${{ matrix.name }}
        # 命名区分架构：music-tui-<goos>-<goarch>[.exe]
        run: go build -trimpath -ldflags "-s -w" -o music-tui-${{ matrix.name }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-tui-${{ matrix.name }}
          path: music-tui-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    # tag 触发（v*）时汇总全部平台 artifact 创建 Release 并上传
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true