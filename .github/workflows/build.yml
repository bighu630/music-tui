name: build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build linux amd64
        run: go build -trimpath -ldflags "-s -w" -o music-tui .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-tui-linux-amd64
          path: music-tui
          if-no-files-found: error

      # tag 触发（v*）时创建 Release 并上传二进制
      - name: Prepare release asset name
        if: startsWith(github.ref, 'refs/tags/')
        run: cp music-tui music-tui-linux-amd64

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: music-tui-linux-amd64
          generate_release_notes: true
